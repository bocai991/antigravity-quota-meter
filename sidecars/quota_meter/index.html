<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>额度</title>
<script src="/preload.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --fg: var(--foreground, #1f1f1f);
    --bg: var(--background, #f7f7f7);
    --mut: var(--muted-foreground, #6b6b6b);
    --card-bg: var(--card, color-mix(in srgb, var(--fg) 3.5%, transparent));
    --line: var(--border, color-mix(in srgb, var(--fg) 10%, transparent));
    --track: color-mix(in srgb, var(--fg) 9%, transparent);
    --ok: #3fb950; --warn: #e3a008; --crit: #f85149;
    --fs: 15px;      /* 正文 */
    --fs-sm: 13.5px; /* 次要信息 */
    --fs-lg: 16.5px; /* 卡片标题 */
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) { :root { --fg: var(--foreground, #ececec); --bg: var(--background, #0a0a0a); --mut: var(--muted-foreground, #9a9a9a); } }
  * { box-sizing: border-box; }
  body { margin:0; font:var(--fs)/1.6 var(--font-family, system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif); color:var(--fg); background:var(--bg); -webkit-font-smoothing:antialiased; }
  .wrap { padding:16px; max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  header h1 { font-size:18px; margin:0; font-weight:650; letter-spacing:.2px; }
  button, select, input { font:inherit; font-size:var(--fs-sm); color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:8px; padding:4px 12px; }
  select option { background:var(--bg); color:var(--fg); }
  button { cursor:pointer; color:var(--mut); transition:color .15s, background .15s; }
  button:hover { color:var(--fg); background:color-mix(in srgb, var(--fg) 6%, transparent); }
  button:disabled { opacity:.5; cursor:default; }
  .card { background:var(--card-bg); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; }
  .gname { font-size:var(--fs-lg); font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .chip { font-size:var(--fs-sm); font-weight:600; padding:2px 10px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .badge { font-size:12.5px; font-weight:500; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .badge.run { color:var(--ok); background:color-mix(in srgb, var(--ok) 15%, transparent); }
  .badge.act { color:var(--warn); background:color-mix(in srgb, var(--warn) 15%, transparent); }
  .badge.idle { color:var(--mut); background:color-mix(in srgb, var(--fg) 7%, transparent); }
  details.models { margin:4px 0 6px; }
  details.models summary { cursor:pointer; color:var(--mut); font-size:var(--fs-sm); list-style:none; user-select:none; }
  details.models summary::-webkit-details-marker { display:none; }
  details.models summary::before { content:'▸ '; }
  details.models[open] summary::before { content:'▾ '; }
  .tag { display:inline-block; font-size:13px; padding:2px 8px; margin:5px 5px 0 0; border:1px solid var(--line); border-radius:6px; color:var(--mut); }
  .row { padding:10px 0 6px; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .pct { font-weight:600; font-variant-numeric:tabular-nums; }
  .bar { height:7px; border-radius:4px; background:var(--track); margin:7px 0 4px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:4px; transition:width .4s ease; }
  svg.spark { display:block; width:100%; height:26px; margin:4px 0 2px; }
  .sub { color:var(--mut); font-size:var(--fs-sm); }
  .conv-item > .kv > .sub { white-space:nowrap; flex-shrink:0; }
  .conv-item > .kv { align-items:flex-start; }
  .advice { border-radius:var(--r); padding:10px 14px; margin-bottom:12px; font-size:var(--fs); border:1px solid; }
  .advice p { margin:0; } .advice p + p { margin-top:6px; }
  .advice.ok { border-color:color-mix(in srgb,var(--ok) 35%,transparent); background:color-mix(in srgb,var(--ok) 8%,transparent); }
  .advice.warn { border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:color-mix(in srgb,var(--warn) 10%,transparent); }
  .advice.crit { border-color:color-mix(in srgb,var(--crit) 45%,transparent); background:color-mix(in srgb,var(--crit) 10%,transparent); }
  details.meter-sec > summary {
    cursor:pointer; list-style:none; user-select:none;
    font-size:var(--fs-lg); font-weight:600;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  details.meter-sec > summary::-webkit-details-marker { display:none; }
  details.meter-sec > summary .mhead::before { content:'▸ '; color:var(--mut); }
  details.meter-sec[open] > summary .mhead::before { content:'▾ '; color:var(--mut); }
  .meter-body { margin-top:8px; }
  .kv { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:var(--fs-sm); padding:3px 0; }
  .kv span:last-child { font-variant-numeric:tabular-nums; }
  .conv-item { border-top:1px solid var(--line); padding:10px 0; }
  .conv-item:first-of-type { border-top:none; }
  .conv-title { font-weight:600; font-size:var(--fs); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  details.conv-fold { margin-top:6px; font-size:var(--fs-sm); }
  details.conv-fold > summary { cursor:pointer; list-style:none; display:flex; align-items:center; flex-wrap:wrap; gap:6px; color:var(--mut); user-select:none; }
  details.conv-fold > summary::-webkit-details-marker { display:none; }
  details.conv-fold > summary::before { content:'▸'; color:var(--mut); margin-right:2px; line-height:1; }
  details.conv-fold[open] > summary::before { content:'▾'; }
  details.conv-fold .tag { margin:0; }
  .conv-body { margin-top:6px; padding-left:16px; color:var(--mut); }
  .ev { font-size:var(--fs-sm); padding:6px 0; border-top:1px solid var(--line); }
  .ev:first-child { border-top:none; }
  .set { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; font-size:var(--fs); }
  .set input[type=number] { width:72px; }
  .set input[type=checkbox] { width:16px; height:16px; accent-color:var(--ok); }
  .foot { color:var(--mut); font-size:13px; text-align:center; margin-top:8px; }
  .err { color:var(--crit); white-space:pre-wrap; }
  details.sec > summary { cursor:pointer; font-weight:600; font-size:var(--fs); color:var(--mut); user-select:none; }
  details.sec[open] > summary { color:var(--fg); }
  body.compact .wrap { padding:10px; }
  body.compact .card { padding:10px 12px; margin-bottom:10px; }
  body.compact .full-only { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>额度速览</h1><button id="refresh" title="立即刷新">↻ 刷新</button></header>
  <div id="advice"></div>
  <div id="pools"><div class="sub">加载中…</div></div>
  <div id="meter"></div>
  <div id="extra" class="full-only"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const compact = new URLSearchParams(location.search).get('mode') === 'compact';
if (compact) document.body.classList.add('compact');

const MIN = 60e3, HOUR = 60 * MIN;
// 额度池名称、窗口名称、模型列表均由后端根据服务端实时数据自动识别后下发，前端不写死任何池子
const zhGroup = n => String(n || '').replace(/\s+and\s+/gi, ' 与 ').replace(/\bmodels?\b/gi, '模型').replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const color = f => f > 0.5 ? 'var(--ok)' : f > 0.2 ? 'var(--warn)' : 'var(--crit)';
const pct = f => (f * 100).toFixed(f > 0 && f < 0.1 ? 1 : 0) + '%';
const dpct = f => (f * 100).toFixed(f < 0.01 ? 2 : 1) + '%';
const gz = name => S?.groups?.find(g => g.name === name)?.label || Object.values(S?.meta || {}).find(m => m.group === name)?.groupLabel || zhGroup(name);
const api = (path, body) => (window.sidecar?.fetch || fetch)(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {}) }).then(r => r.json());

function dur(ms) {
  if (!(ms > 0)) return '1分钟内';
  const m = Math.max(1, Math.round(ms / MIN)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
  return d ? `${d}天${h}小时` : h ? `${h}小时${m % 60}分` : `${m % 60}分钟`;
}
const resetMs = b => Date.parse(b.reset) - Date.now();
const etaMs = b => b.ratePerHour > 0.001 ? b.frac / b.ratePerHour * HOUR : null;
const models = g => g.models?.length ? g.models : [g.name];
const winOrder = b => b.winMs ?? Infinity; // 短窗口在前（如 5 小时 → 每周）
const winTitle = b => b.winKnown ? b.winLabel + '剩余限额' : esc(b.label);

let S = null;
let meterOpen = { card: true, moreConv: false };
let convOpen = {};
const fmtTok = n => !n ? '0' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);

// ---------- 功能 4：切换建议 ----------
function renderAdvice() {
  const th = S.settings.threshold / 100;
  const pools = S.groups.filter(g => g.buckets.length).map(g => {
    const lim = g.buckets.reduce((a, b) => b.frac < a.frac ? b : a);
    return { g, lim, eff: lim.frac, eta: etaMs(lim) };
  });
  const msgs = [];
  for (const p of pools) {
    const soon = p.eta != null && p.eta < 45 * MIN && p.eta < resetMs(p.lim);
    if (p.eff >= th && !soon) continue;
    const alt = pools.filter(q => q !== p && q.eff >= Math.max(th, 0.3)).sort((a, b) => b.eff - a.eff)[0];
    let t = `<b>${esc(gz(p.g.name))}</b> ${p.lim.winKnown ? p.lim.winLabel : ''}额度${p.eff < 0.02 ? '已用完' : '仅剩 ' + pct(p.eff)}`;
    if (soon && p.eff >= 0.02) t += `，按当前速度约 ${dur(p.eta)}后耗尽`;
    t += `，${dur(resetMs(p.lim))}后重置。`;
    t += alt ? `建议先切换到 <b>${esc(gz(alt.g.name))}</b>（剩 ${pct(alt.eff)}，如 ${esc(models(alt.g)[0])}）。`
             : '其他池子也不充裕，建议缩小任务或等待重置。';
    msgs.push({ level: p.eff < 0.05 ? 'crit' : 'warn', t });
  }
  const level = msgs.some(m => m.level === 'crit') ? 'crit' : msgs.length ? 'warn' : 'ok';
  if (!msgs.length) msgs.push({ t: `${pools.length} 个额度池都充足，可以放心使用。` });
  document.getElementById('advice').innerHTML = `<div class="advice ${level}">${msgs.map(m => `<p>${m.t}</p>`).join('')}</div>`;
}

// ---------- 额度池 + 功能 1：速率 / 曲线 ----------
function spark(series, f) {
  const pts = series?.pts;
  if (!pts || pts.length < 2) return '';
  const now = S.now, W = 300, H = 24;
  const all = pts.at(-1)[0] < now - 10e3 ? [...pts, [now, f]] : pts;
  const span = Math.max(5 * MIN, now - all[0][0]);
  const xy = all.map(([t, v]) => `${Math.max(0, Math.min(W, W * (1 - (now - t) / span))).toFixed(1)},${(2 + (H - 4) * (1 - v)).toFixed(1)}`);
  return `<svg class="spark full-only" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${xy.join(' ')}" fill="none" stroke="${color(f)}" stroke-width="1.5" stroke-opacity=".75" vector-effect="non-scaling-stroke"/></svg>`;
}

function bucketSub(b) {
  const reset = b.reset ? `${dur(resetMs(b))}后重置` : '';
  if (b.ratePerHour == null) return b.frac >= 1 ? '未使用' : `正在采集消耗速度… · ${reset}`;
  if (b.ratePerHour <= 0.001) return `近 45 分钟未消耗 · ${reset}`;
  const eta = etaMs(b);
  const r = `消耗 ${dpct(b.ratePerHour)}/小时`;
  return eta < resetMs(b) ? `${r} · <b style="color:var(--warn)">约 ${dur(eta)}后耗尽</b> · ${reset}` : `${r} · 重置前用不完 · ${reset}`;
}

function renderPools() {
  document.getElementById('pools').innerHTML = S.groups.map(g => {
    const bs = [...g.buckets].sort((a, b) => winOrder(a) - winOrder(b));
    const min = Math.min(...bs.map(b => b.frac));
    return `<div class="card">
      <div class="gname"><span>${esc(gz(g.name))}</span><span class="chip" style="color:${color(min)};background:color-mix(in srgb, ${color(min)} 14%, transparent)">${pct(min)}</span></div>
      <details class="models full-only"><summary>包含模型</summary>${models(g).map(m => `<span class="tag">${esc(m)}</span>`).join('')}</details>
      ${bs.map(b => `<div class="row">
        <div class="top"><span>${winTitle(b)}</span><span class="pct">剩余 ${pct(b.frac)}</span></div>
        <div class="bar"><i style="width:${b.frac * 100}%;background:${color(b.frac)}"></i></div>
        ${spark(b.series, b.frac)}
        <div class="sub">${bucketSub(b)}</div>
      </div>`).join('')}
    </div>`;
  }).join('') || '<div class="sub">没有额度数据</div>';
}

// ---------- 功能 3：按「对话列表」自动统计并行任务油耗 ----------
function usedRows(used, resets) {
  const groups = {};
  for (const [id, u] of Object.entries(used || {})) {
    const m = S.meta[id]; if (!m) continue;
    (groups[m.group] ||= []).push({ win: m.winLabel || m.window, ms: m.winMs ?? Infinity, u, reset: resets?.[id] });
  }
  const rows = Object.entries(groups).filter(([, a]) => a.some(x => x.u > 0.00005));
  if (!rows.length) return '<div class="sub">暂未产生明显额度消耗</div>';
  return rows.map(([g, a]) => `<div class="kv"><span>${esc(gz(g))}</span><span>${
    a.sort((x, y) => x.ms - y.ms)
     .map(x => `${esc(x.win)} ${dpct(x.u)}${x.reset ? '*' : ''}`).join(' · ')}</span></div>`).join('')
    + (Object.values(resets || {}).some(Boolean) ? '<div class="sub">* 期间发生过重置，已自动跨重置累计</div>' : '');
}

function renderConvCard(c) {
  const badge = c.status === 'running'
    ? '<span class="badge run">● 进行中</span>'
    : c.active
    ? `<span class="badge act">⚡ ${dur(S.now - c.updatedAt)}前活跃</span>`
    : `<span class="badge idle">${c.updatedAt ? new Date(c.updatedAt).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '已休眠'}</span>`;
  const models = c.models?.length ? c.models : ['暂无模型调用'];
  const mtags = models.map(m => `<span class="tag">${esc(m)}</span>`).join('');
  const tk = c.tokens || {};
  const tokLine = tk.total
    ? `<div class="kv"><span>Token 消耗</span><span>共 ${fmtTok(tk.total)}（输入 ${fmtTok(tk.input)} · 缓存 ${fmtTok(tk.cache)} · 输出 ${fmtTok(tk.output)}）</span></div>`
    : '';
  return `<div class="conv-item">
    <div class="kv">
      <span class="conv-title">${esc(c.title)} ${badge}</span>
      <span class="sub">${c.modelSteps || 0} 轮调用</span>
    </div>
    <details class="conv-fold" data-cid="${esc(c.id)}" ${convOpen[c.id] ? 'open' : ''}>
      <summary>${mtags}</summary>
      <div class="conv-body">
        ${usedRows(c.used, c.resets)}
        ${tokLine}
      </div>
    </details>
  </div>`;
}

function renderMeter() {
  const el = document.getElementById('meter');
  const convs = S.conversations || [];
  const activeConvs = convs.filter(c => c.active);
  const topConvs = activeConvs.length ? activeConvs : convs.slice(0, 3);
  const topIds = new Set(topConvs.map(c => c.id));
  const restConvs = convs.filter(c => !topIds.has(c.id));

  let h = `<div class="card">
    <details class="meter-sec" id="dmeter" ${meterOpen.card ? 'open' : ''}>
      <summary>
        <span class="mhead">任务油耗统计（按对话列表自动命名）</span>
        <span class="sub" style="font-weight:400">${activeConvs.length ? `${activeConvs.length} 个对话并行/活跃` : `共 ${convs.length} 个对话`}</span>
      </summary>
      <div class="meter-body">`;

  if (topConvs.length) {
    h += topConvs.map(renderConvCard).join('');
  } else {
    h += '<div class="sub">暂无对话记录</div>';
  }

  if (restConvs.length && !compact) {
    h += `<details class="sec" id="dmoreconv" style="margin-top:6px" ${meterOpen.moreConv ? 'open' : ''}>
      <summary>其他历史对话（${restConvs.length}）</summary>
      <div style="margin-top:4px">${restConvs.map(renderConvCard).join('')}</div>
    </details>`;
  }

  h += `</div></details></div>`;
  el.innerHTML = h;

  const $ = id => document.getElementById(id);
  $('dmeter') && ($('dmeter').ontoggle = e => meterOpen.card = e.target.open);
  el.querySelectorAll('details.conv-fold').forEach(d => d.ontoggle = e => { convOpen[d.dataset.cid] = e.target.open; });
  $('dmoreconv') && ($('dmoreconv').ontoggle = e => meterOpen.moreConv = e.target.open);
}

// ---------- 功能 2：提醒记录 + 设置 ----------
let extraOpen = { ev:false, set:false };
function renderExtra() {
  const s = S.settings;
  const ev = S.events.length
    ? S.events.map(e => `<div class="ev"><b>${esc(e.title)}</b> · ${esc(e.body)} <span class="sub">${new Date(e.t).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span></div>`).join('')
    : '<div class="sub">暂无提醒</div>';
  document.getElementById('extra').innerHTML = `
    <div class="card"><details class="sec" id="dev" ${extraOpen.ev ? 'open' : ''}><summary>最近提醒（${S.events.length}）</summary><div style="margin-top:6px">${ev}</div></details></div>
    <div class="card"><details class="sec" id="dset" ${extraOpen.set ? 'open' : ''}><summary>提醒与刷新设置</summary><div style="margin-top:6px">
      <div class="set"><span>低于多少时提醒（%）</span><input type="number" id="sth" min="5" max="60" value="${s.threshold}"/></div>
      <div class="set"><span>弹出系统通知</span><input type="checkbox" id="snt" ${s.notify ? 'checked' : ''}/></div>
      <div class="set"><span>额度恢复时也通知</span><input type="checkbox" id="snr" ${s.notifyRecover ? 'checked' : ''}/></div>
      <div class="set"><span>后台刷新间隔</span><select id="spm">${[1, 2, 5, 10].map(n => `<option value="${n}" ${s.pollMin == n ? 'selected' : ''}>${n} 分钟</option>`).join('')}</select></div>
      <div class="set"><span class="sub">额度用到 5% 以下会再提醒一次；每个阈值只提醒一次，恢复后重新计算。</span><button id="stest">测试通知</button></div>
    </div></details></div>`;
  const $ = id => document.getElementById(id);
  $('dev').ontoggle = e => extraOpen.ev = e.target.open;
  $('dset').ontoggle = e => extraOpen.set = e.target.open;
  const upd = async body => { S = await api('api/settings', body); render(); };
  $('sth').onchange = e => upd({ threshold: +e.target.value });
  $('snt').onchange = e => upd({ notify: e.target.checked });
  $('snr').onchange = e => upd({ notifyRecover: e.target.checked });
  $('spm').onchange = e => upd({ pollMin: +e.target.value });
  $('stest').onclick = () => api('api/test-notify');
}

function render() {
  if (!S) return;
  S.now = Date.now();
  if (S.error && !S.groups?.length) {
    document.getElementById('pools').innerHTML = `<div class="card err">${esc(S.error)}</div>`;
    return;
  }
  renderAdvice(); renderPools(); renderMeter();
  if (!compact) renderExtra();
  document.getElementById('foot').textContent = (S.error ? '⚠ 最近一次刷新失败 · ' : '') +
    '更新于 ' + new Date(S.fetchedAt).toLocaleTimeString('zh-CN') + ` · 后台每 ${S.settings.pollMin} 分钟刷新 · 不消耗 token`;
}

let lastRenderKey = '';
async function load(forceRender = false) {
  try {
    const next = await (await fetch('api/state')).json();
    const key = `${next.fetchedAt}|${next.error || ''}|${(next.conversations || []).map(c => `${c.id}:${c.title}:${c.status}:${c.modelSteps}`).join(',')}`;
    S = next;
    if (!forceRender && key === lastRenderKey) return;
    lastRenderKey = key;
  } catch (e) { S = { error: '无法连接额度服务：' + e.message, groups: [] }; }
  render();
}
document.getElementById('refresh').onclick = async e => { e.target.disabled = true; S = await api('api/refresh'); lastRenderKey = ''; render(); e.target.disabled = false; };
load(true);
// 面板隐藏时 0 轮询；切回面板瞬间刷新一次，停留在面板时每 30 秒轻量比对一次（数据未变则不重绘 DOM）
setInterval(() => document.visibilityState === 'visible' && load(false), 30e3);
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load(false));
</script>
</body>
</html>
